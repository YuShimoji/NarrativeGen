<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>前提入力（ラフ） | NarrativeGen Studio</title>
    <link rel="stylesheet" href="./src/styles.css" />
    <link rel="stylesheet" href="./src/premise-draft.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">NarrativeGen <span>Studio</span></div>
      <a class="draft-back" href="./">物語の実行へ</a>
    </header>
    <main class="premise-draft">
      <div class="draft-heading">
        <div>
          <h1>前提入力（ラフ）</h1>
          <p id="draft-sample" class="sub"></p>
        </div>
        <div class="draft-heading-actions">
          <button type="button" id="draft-new" class="btn">自分の前提を作る</button>
          <button type="button" id="draft-load-premise" class="btn">前提を開く</button>
          <button type="button" id="draft-reset" class="btn">見本に戻す</button>
        </div>
      </div>
      <div class="draft-layout">
        <form id="draft-form" class="draft-form">
          <section class="card draft-card" aria-labelledby="draft-thing">
            <h2 id="draft-thing">場の物</h2>
            <label id="draft-title-field" class="draft-title-field" hidden>物語の名前（任意）<input name="story-title" type="text" disabled /></label>
            <div class="draft-thing-fields">
              <label>物の名前<input name="thing-name" type="text" required /></label>
              <label id="draft-property-field" hidden>性質の名前<input name="property-name" type="text" placeholder="長さなど" required disabled /></label>
              <label><span id="draft-actual-label">重さの実際の値</span><input name="actual" type="number" min="0" step="any" required /></label>
            </div>
          </section>
          <section class="card draft-card" aria-labelledby="draft-people">
            <h2 id="draft-people">人物の知識</h2>
            <p class="sub draft-section-detail">正確さは0〜1で入力します。許容幅は見込みに対する割合です（0.05 は 5%）。</p>
            <div class="draft-people-head" aria-hidden="true">
              <span>人物</span><span>知識の分野</span><span>正確さ</span><span>許容幅</span><span id="draft-expected-label">重さの見込み</span>
            </div>
            <div id="draft-person-fields"></div>
            <button type="button" id="draft-add-person" class="btn draft-add-person" hidden>＋ 人物を追加</button>
          </section>
          <details id="draft-intent" class="card draft-card draft-intent" hidden>
            <summary>作者の意図（任意）</summary>
            <fieldset>
              <legend>入れたい出来事</legend>
              <div id="draft-beats" class="draft-intent-options"></div>
            </fieldset>
            <label>望む結末<select name="intent-ending" id="draft-intent-ending"></select></label>
          </details>
          <button type="button" id="draft-save-premise" class="btn draft-save-premise" hidden>前提を保存</button>
        </form>
        <aside class="card draft-card draft-result" aria-labelledby="draft-result-title">
          <div class="draft-result-head">
            <h2 id="draft-result-title">前提を試算</h2>
            <button type="submit" id="draft-submit" form="draft-form" class="btn btn-primary">試算する</button>
          </div>
          <p id="draft-status" class="sub draft-status" role="status">見本の結果を表示しています。</p>
          <button type="button" id="draft-open-story" class="btn" hidden>この物語を開く</button>
          <div id="draft-output"></div>
        </aside>
      </div>
      <p class="sub draft-footnote">入力を次回も使うには「前提を保存」でファイルに残せます。</p>
      <input type="file" id="draft-premise-file" accept=".json,application/json" hidden />
    </main>
    <script type="module" src="./src/premise-draft.js"></script>
  </body>
</html>
