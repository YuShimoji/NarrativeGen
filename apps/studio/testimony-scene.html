<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>証言への反応を比べる | NarrativeGen Studio</title>
    <link rel="stylesheet" href="./src/styles.css" />
  </head>
  <body>
    <header class="topbar">
      <div class="brand">NarrativeGen <span>Studio</span></div>
      <a class="testimony-back" href="./">物語の実行に戻る</a>
    </header>
    <main class="testimony-scene">
      <nav class="testimony-examples" aria-label="比較する見本">
        <a href="./testimony-scene.html" data-scene="stage">舞台の暗転</a>
        <a href="./testimony-scene.html?scene=crate" data-scene="crate">搬入口の荷箱</a>
      </nav>
      <h1 id="testimony-title"></h1>
      <p id="testimony-intro"></p>
      <p class="testimony-measurement"><strong id="testimony-actual"></strong> <span id="testimony-measurement-source" class="sub"></span></p>
      <section id="testimony-accounts" class="testimony-accounts" aria-label="二人の証言"></section>
      <section class="card testimony-results" aria-labelledby="testimony-results-title">
        <h2 id="testimony-results-title">聞き手三人の反応</h2>
        <table>
          <thead>
            <tr>
              <th scope="col">聞き手</th>
              <th scope="col">実測との差 <span class="sub">前 → 後</span></th>
              <th scope="col">違和感 <span class="sub">前 → 後</span></th>
            </tr>
          </thead>
          <tbody id="testimony-reactions" aria-live="polite"></tbody>
        </table>
        <p class="sub">聞いた後の見込みと許容幅は、本人と二人の値を知識の正確さで重み付けして求めます。実測値が本人の許容範囲を外れると、違和感が生じます。</p>
      </section>
    </main>
    <script type="module" src="./src/testimony-scene.js"></script>
  </body>
</html>
